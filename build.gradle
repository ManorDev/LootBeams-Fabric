// Root project orchestrates all version subprojects

subprojects {
    apply plugin: 'maven-publish'
    repositories {
        mavenCentral()
        google()
        maven { url = "https://repo.polyfrost.org/releases" }
        maven { url = "https://maven.legacyfabric.net/" }
    }
}

task buildAll {
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'build' } }
}

defaultTasks 'build'
